<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Macedonia — Contact</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/styles.css"/>
  <style>
    :root{
      --primary-pink:        #EC4899;
      --primary-purple:      #9333EA;
      --pink-light:          #FCE7F3;
      --text-dark:           #212121;
      --white:               #FFFFFF;
      --text-muted:          #757575;
      --border-light:        #E0E0E0;
      --shadow-sm:0 2px 10px rgba(0,0,0,0.05);
    }
    svg{stroke-linecap:round;stroke-linejoin:round;display:block;}
    .contact-card { background:var(--white); border-radius:16px; box-shadow:var(--shadow-sm); border:1px solid var(--border-light); margin:16px; overflow:hidden; }
    .contact-item { display:flex; align-items:center; gap:14px; padding:16px; border-bottom:1px solid var(--border-light); text-decoration:none; }
    .contact-item:last-child { border-bottom:none; }
    .ci-icon { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#fff; }
    .ci-icon svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;}
    .ci-icon.tg{background:linear-gradient(135deg,#3AA9E0,#1E8DC8);}
    .ci-icon.wa{background:linear-gradient(135deg,#2BC15E,#1FA24C);}
    .ci-icon.cs{background:linear-gradient(135deg,var(--primary-pink),var(--primary-purple));}
    .ci-title { font-size:15px; font-weight:700; color:var(--text-dark); }
    .ci-sub { font-size:12px; color:var(--text-muted); margin-top:2px; }
    .ci-go{margin-left:auto;font-size:17px;color:var(--border-light);}
  </style>
  <link rel="stylesheet" href="assets/css/macedonia-ui.css">
  <script src="assets/js/macedonia-display.js"></script>
</head>
<body>
<div class="page-wrap">
  <div class="topbar">
    <a class="back-btn" href="profile.html">‹</a>
    <span class="topbar-title" style="display:flex;align-items:center;gap:8px">
      <svg viewBox="0 0 24 24" style="width:17px;height:17px;stroke:var(--primary-pink);stroke-width:2;fill:none"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      Contact Support
    </span>
  </div>
  <div class="contact-card">
    <a class="contact-item" id="tgSupportLink" href="https://t.me/Macedonia32" target="_blank" rel="noopener">
      <div class="ci-icon tg"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></div>
      <div><div class="ci-title">Telegram Support</div><div class="ci-sub">Chat with our team directly</div></div>
      <div class="ci-go">›</div>
    </a>
    <a class="contact-item" id="tgCommunityLink" href="https://t.me/+ZBPQYNyTdks0NjI8" target="_blank" rel="noopener">
      <div class="ci-icon tg"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
      <div><div class="ci-title">Telegram Community</div><div class="ci-sub">Join the group</div></div>
      <div class="ci-go">›</div>
    </a>
    <a class="contact-item" id="waLink" href="https://chat.whatsapp.com/" target="_blank" rel="noopener">
      <div class="ci-icon wa"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
      <div><div class="ci-title">WhatsApp</div><div class="ci-sub">Chat with the community</div></div>
      <div class="ci-go">›</div>
    </a>
    <a class="contact-item" id="csLink" href="tel:+2340000000000">
      <div class="ci-icon cs"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></div>
      <div><div class="ci-title">Customer Service</div><div class="ci-sub" id="csSub">Reach our support team</div></div>
      <div class="ci-go">›</div>
    </a>
  </div>
</div>
<script>
(function(){
  // Links are admin-editable (Settings → Contact & Community Links in the
  // admin panel), so fetch the live values instead of trusting the hrefs
  // hardcoded above — those are just a fallback for if this request fails.
  fetch("/api/team?action=contact-links").then(function(r){ return r.json(); }).then(function(d){
    if(!d.ok || !d.links) return;
    var l=d.links;
    if(l.telegram_support_url) document.getElementById("tgSupportLink").href=l.telegram_support_url;
    if(l.telegram_community_url) document.getElementById("tgCommunityLink").href=l.telegram_community_url;
    if(l.whatsapp_url) document.getElementById("waLink").href=l.whatsapp_url;
    if(l.customer_service_url){
      var csLink=document.getElementById("csLink");
      csLink.href=l.customer_service_url;
      document.getElementById("csSub").textContent = l.customer_service_url.indexOf("tel:")===0
        ? l.customer_service_url.replace("tel:","")
        : "Reach our support team";
    }
  }).catch(function(e){ console.warn("Could not load contact links, using defaults:",e); });
})();
</script>
</body>
</html>
