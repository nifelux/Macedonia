<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Macedonia — My Oil Packages</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/styles.css"/>
  <style>
    .collect-hero {
      background: linear-gradient(135deg,var(--purple),var(--sky));
      padding:24px 20px; color:#fff; text-align:center;
    }
    .collect-amount { font-size:40px; font-weight:800; margin:8px 0; }
    .collect-btn {
      background:#fff; color:var(--purple); border:none;
      padding:13px 36px; border-radius:50px; font-size:16px; font-weight:800;
      cursor:pointer; margin-top:14px; transition:opacity .15s;
    }
    .collect-btn:disabled { opacity:.4; cursor:not-allowed; }
    .up-card { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); margin:0 16px 12px; overflow:hidden; }
    .up-header { padding:14px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .up-name { font-size:15px; font-weight:700; color:var(--text); }
    .up-body { padding:14px 16px; }
    .up-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
    .us-val { font-size:14px; font-weight:800; color:var(--purple); }
    .us-lbl { font-size:10px; color:var(--muted); text-transform:uppercase; margin-top:2px; }
    .prog-wrap { margin-bottom:4px; }
    .prog-bar { height:6px; background:var(--bg); border-radius:6px; overflow:hidden; }
    .prog-fill { height:100%; background:linear-gradient(90deg,var(--purple),var(--sky)); border-radius:6px; transition:width .4s; }
    .prog-label { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:4px; }
    .status-done { background:#DDF6EA; color:#0D6548; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:700; }
  </style>
  <link rel="stylesheet" href="assets/css/macedonia-ui.css">
  <script src="assets/js/macedonia-display.js"></script>
</head>
<body data-supabase-url="YOUR_SUPABASE_URL" data-supabase-anon="YOUR_SUPABASE_ANON_KEY">
<div class="page-wrap">
  <div class="topbar">
    <a class="back-btn" href="profile.html">‹</a>
    <span class="topbar-title">📦 My Oil Packages</span>
    <div></div>
  </div>

  <div class="collect-hero">
    <div style="font-size:12px;opacity:.8;text-transform:uppercase;letter-spacing:.08em">Today's Package Credit</div>
    <div class="collect-amount" id="todayIncome">₦0.00</div>
    <div style="font-size:13px;opacity:.75" id="collectSub">Loading…</div>
    <button class="collect-btn" id="collectBtn" disabled onclick="collectAll()">Collect All</button>
  </div>

  <div style="padding:16px 16px 8px;display:flex;align-items:center;justify-content:space-between">
    <span style="font-size:15px;font-weight:700">Active oil packages</span>
    <a href="products.html" style="font-size:13px;color:var(--purple);font-weight:600">+ Buy More</a>
  </div>

  <div id="prodList"><div class="loader-wrap"><div class="loader"></div></div></div>

  <div style="padding:16px 16px 8px;font-size:15px;font-weight:700;margin-top:4px">Completed</div>
  <div id="doneList"></div>
  <div style="height:16px"></div>
</div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="assets/js/greenew.js" defer></script>
<script src="assets/js/supabase.js" defer></script>
<script src="assets/js/auth.js" defer></script>
<script>
(function(){
  var uid="";
  function waitSb(cb){if(window.sb&&window.GreenewAuth){cb();return;}var t=setInterval(function(){if(window.sb&&window.GreenewAuth){clearInterval(t);cb();}},50);}
  waitSb(async function(){
    var s=await window.GreenewAuth.requireAuth(); if(!s)return;
    uid=s.user.id;
    await load();
  });

  async function load(){
    var {data:prods}=await window.sb.from("user_products").select("*,products(name,description,type,vip_level)").eq("user_id",uid).order("created_at",{ascending:false});
    var today=new Date().toISOString().slice(0,10);
    function dateOnly(value){
      if(!value) return "";
      var raw=String(value).slice(0,10);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(raw)) return "";
      var parsed=new Date(raw+"T00:00:00");
      return Number.isNaN(parsed.getTime()) ? "" : raw;
    }
    function addOneDay(value){
      if(!value) return "";
      var d=new Date(dateOnly(value)+"T00:00:00");
      d.setDate(d.getDate()+1);
      return d.toISOString().slice(0,10);
    }
    function formatDate(value){
      var raw=dateOnly(value);
      if(!raw) return "Date unavailable";
      return new Date(raw+"T00:00:00").toLocaleDateString();
    }
    function claimableFrom(p){ return dateOnly(p.claimable_from)||addOneDay(p.purchased_on||p.created_at); }
    function canClaim(p){
      var last=dateOnly(p.last_collected_at||p.last_claim_date);
      return claimableFrom(p)<=today && (!last||last<today);
    }
    var active=(prods||[]).filter(function(p){return p.status==="active";});
    var done=(prods||[]).filter(function(p){return p.status==="completed";});
    var collectible=active.filter(canClaim);
    var totalToday=collectible.reduce(function(s,p){return s+Number(p.daily_income||0);},0);

    document.getElementById("todayIncome").textContent=window.GreenewAuth.money(totalToday);
    document.getElementById("collectSub").textContent=collectible.length+" product"+(collectible.length!==1?"s":"")+" ready to collect";
    document.getElementById("collectBtn").disabled=collectible.length===0;
    if(collectible.length===0) document.getElementById("collectBtn").textContent="Already Collected Today";

    var el=document.getElementById("prodList");
    if(!active.length){
      el.innerHTML='<div class="empty"><div class="empty-icon">📦</div><p>No active products.<br><a href="products.html" style="color:var(--purple);font-weight:700">Browse oil packages →</a></p></div>';
    } else {
      el.innerHTML=active.map(function(p){
        var pct=p.duration_days?Math.min(100,Math.round((p.days_collected/p.duration_days)*100)):0;
        var canCollect=canClaim(p);
        var claimDate=claimableFrom(p);
        var stateLabel=claimDate>today?"Starts tomorrow":(canCollect?"Ready":"Collected");
        return '<div class="up-card">'+
          '<div class="up-header">'+
            '<div>'+
              '<div class="up-name">'+window.MacedoniaDisplay.packageName(p.products)+'</div>'+
              '<div style="font-size:11px;color:var(--muted);margin-top:2px">Purchased '+formatDate(p.purchased_on||p.created_at)+(claimDate>today?' · '+formatDate(claimDate)+' claimable':'')+'</div>'+
            '</div>'+
            '<span style="font-size:11px;font-weight:700;color:'+(canCollect?"var(--success)":"var(--muted)")+'">'+
              (canCollect?"● Ready":(claimDate>today?"◷ Starts tomorrow":"✓ Collected"))+'</span>'+
          '</div>'+
          '<div class="up-body">'+
            '<div class="up-stats">'+
              '<div><div class="us-val">'+window.GreenewAuth.money(p.daily_income)+'</div><div class="us-lbl">Package Credit</div></div>'+
              '<div><div class="us-val">'+p.days_collected+'/'+p.duration_days+'</div><div class="us-lbl">Days</div></div>'+
              '<div><div class="us-val">'+window.GreenewAuth.money(p.total_earned)+'</div><div class="us-lbl">Package Credit</div></div>'+
            '</div>'+
            '<div class="prog-wrap">'+
              '<div class="prog-bar"><div class="prog-fill" style="width:'+pct+'%"></div></div>'+
              '<div class="prog-label"><span>Progress</span><span>'+pct+'%</span></div>'+
            '</div>'+
          '</div>'+
        '</div>';
      }).join("");
    }

    var dl=document.getElementById("doneList");
    if(done.length){
      dl.innerHTML=done.map(function(p){
        return '<div class="up-card">'+
          '<div class="up-header">'+
            '<div class="up-name">'+window.MacedoniaDisplay.packageName(p.products)+'</div>'+
            '<span class="status-done">✅ Completed</span>'+
          '</div>'+
          '<div class="up-body">'+
            '<div class="up-stats">'+
              '<div><div class="us-val">'+p.duration_days+'d</div><div class="us-lbl">Duration</div></div>'+
              '<div><div class="us-val">'+window.GreenewAuth.money(p.total_earned)+'</div><div class="us-lbl">Total Earned</div></div>'+
              '<div><div class="us-val">'+window.GreenewAuth.money(p.amount||p.amount_paid)+'</div><div class="us-lbl">Powered</div></div>'+
            '</div>'+
          '</div>'+
        '</div>';
      }).join("");
    } else {
      dl.innerHTML='<div class="empty" style="padding:20px"><p style="font-size:13px;color:var(--muted)">No completed products yet.</p></div>';
    }
  }

  window.collectAll=async function(){
    var btn=document.getElementById("collectBtn");
    btn.disabled=true; btn.textContent="Collecting…";
    var r=await fetch("/api/user?action=collect-income",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:uid})});
    var d=await r.json();
    if(d.ok){
      window.GreenewAuth.toast("✅ Collected "+window.GreenewAuth.money(d.amount)+"!");
      await load();
    } else {
      window.GreenewAuth.toast(d.error||"Nothing to collect");
      btn.disabled=false; btn.textContent="Collect All";
    }
  };
})();
</script>
</body>
  </html>
