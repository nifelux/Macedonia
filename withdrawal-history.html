<!DOCTYPE html>

:root{--ledger:#082d4d;--signal:#f2be3f;--mist:#f4f7f8;--line:#dce7eb;--muted:#71828e}*{box-sizing:border-box}body{background:var(--mist)!important;color:var(--ledger)!important}.payout-page{min-height:100vh!important;background:linear-gradient(180deg,#fff 0,#f4f7f8 100%)!important;padding-bottom:34px!important}.ledger-topbar{height:70px;display:flex;align-items:center;gap:13px;padding:0 19px;background:rgba(255,255,255,.96);border-bottom:1px solid #e5ecef}.ledger-back{display:grid;place-items:center;width:41px;height:41px;border:1px solid #d4e1e7;border-radius:13px;background:#f3f8fa;color:var(--ledger);font:30px/1 Arial,sans-serif;text-decoration:none}.ledger-title{font-family:Fraunces,serif;font-size:21px;font-weight:600;letter-spacing:-.025em}.ledger-dot{width:7px;height:7px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 4px #fff4d6}.activity-hero{position:relative;overflow:hidden;padding:27px 21px 30px;background:radial-gradient(circle at 92% 0,rgba(44,137,199,.88),transparent 35%),linear-gradient(130deg,#06263f,#075181 68%,#0a6faf);color:#fff}.activity-hero:after{content:"";position:absolute;right:-85px;bottom:-125px;width:225px;height:225px;border:1px solid rgba(255,255,255,.2);border-radius:50%;box-shadow:0 0 0 29px rgba(255,255,255,.035)}.hero-overline{position:relative;z-index:1;display:flex;align-items:center;gap:8px;color:#cee7f4;font:500 10px "DM Mono",monospace;letter-spacing:.15em}.hero-overline:before{content:"";width:23px;height:2px;background:var(--signal)}.hero-title{position:relative;z-index:1;margin-top:16px;color:#fff!important;font-family:Fraunces,serif;font-size:29px;line-height:1.08;font-weight:600;letter-spacing:-.035em}.hero-copy{position:relative;z-index:1;max-width:337px;margin:9px 0 0;color:#d9ebf3!important;font-size:13px;line-height:1.52}.hero-stamp{position:relative;z-index:1;display:inline-flex;align-items:center;gap:7px;margin-top:19px;color:#f2f7fa!important;font:500 10px "DM Mono",monospace;letter-spacing:.07em}.hero-stamp i{width:7px;height:7px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 4px rgba(242,190,63,.16)}.ledger-main{position:relative;margin-top:-15px;padding:0 15px}.history-section{margin-top:25px}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:0 5px 11px}.section-overline{color:#70838f;font:500 10px "DM Mono",monospace;letter-spacing:.13em}.section-title{margin:5px 0 0;color:var(--ledger)!important;font-family:Fraunces,serif;font-size:20px;font-weight:600;letter-spacing:-.025em}.section-sub{margin:4px 0 0;color:var(--muted)!important;font-size:11px}.record-count{padding:6px 8px;border:1px solid #dbe5e9;border-radius:999px;color:#607c8c;font:500 9px "DM Mono",monospace;letter-spacing:.07em;white-space:nowrap}#histList{overflow:hidden;border:1px solid var(--line);border-radius:19px;background:#fff;box-shadow:0 12px 28px rgba(13,56,82,.07)}.ledger-loading,.ledger-empty{display:flex;min-height:164px;align-items:center;justify-content:center;padding:25px;text-align:center;color:#77909e;font-size:12px}.ledger-loading{gap:9px;font:500 10px "DM Mono",monospace;letter-spacing:.08em}.spinner{width:18px;height:18px;border:2px solid #d9e6eb;border-top-color:#157bb5;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.ledger-empty{flex-direction:column;gap:8px}.ledger-empty strong{color:#3c5a6c;font-size:14px}.ledger-empty span{max-width:255px;font-size:12px;line-height:1.5}.empty-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:#fdf2ee;color:#b65944}.empty-mark svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7}.payout-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:13px;padding:17px;border-bottom:1px solid #edf2f4;background:#fff}.payout-row:last-child{border-bottom:0}.payout-main{min-width:0}.payout-heading{display:flex;align-items:center;gap:8px;color:#103e5b;font-size:13px;font-weight:800}.bank-mark{display:grid;place-items:center;width:27px;height:27px;flex:0 0 27px;border-radius:9px;background:#edf5fa;color:#1175a9}.bank-mark svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}.status-tag{padding:4px 7px;border-radius:7px;font:500 9px "DM Mono",monospace;letter-spacing:.05em;text-transform:uppercase}.s-pending{background:#fff5d9;color:#8b6500}.s-approved{background:#e8f1fb;color:#226295}.s-completed{background:#e5f5ee;color:#197050}.s-rejected,.s-failed,.s-cancelled{background:#fcebea;color:#ad4c3d}.payout-destination{margin:7px 0 0;color:#597384;font-size:11px}.payout-date{margin:5px 0 0;color:#84949d;font-size:11px}.payout-provider{display:inline-block;margin-top:8px;color:#667f8e;font:500 9px "DM Mono",monospace;letter-spacing:.05em}.payout-amount{align-self:start;color:#b34e3d;font-family:Fraunces,serif;font-size:18px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}.payout-amount:before{content:"−";margin-right:1px}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
</style></head><body data-supabase-url="YOUR_SUPABASE_URL" data-supabase-anon="YOUR_SUPABASE_ANON_KEY"><div class="page-wrap payout-page"><header class="ledger-topbar"><a class="ledger-back" href="profile.html" aria-label="Back to profile">‹</a><span class="ledger-dot" aria-hidden="true"></span><span class="ledger-title">Payout ledger</span></header><section class="activity-hero"><div class="hero-overline">ACCOUNT PAYOUTS</div><div class="hero-title">Track every payout request.</div><p class="hero-copy">Review your bank destinations and processing status from request through provider settlement.</p><div class="hero-stamp"><i></i>PROVIDER STATUS TRACKING</div></section><main class="ledger-main"><section class="history-section"><div class="section-head"><div><div class="section-overline">PAYOUT RECORDS</div><h1 class="section-title">Withdrawal register</h1><p class="section-sub">Each entry carries the latest payout processing status.</p></div><span class="record-count" id="recordCount">— RECORDS</span></div><div id="histList"><div class="ledger-loading"><span class="spinner"></span>LOADING LEDGER</div></div></section></main></div><div id="toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="assets/js/supabase.js" defer></script><script src="assets/js/auth.js" defer></script><script>
(function(){function waitSb(cb){if(window.sb&&window.MacedoniaAuth){cb();return;}var t=setInterval(function(){if(window.sb&&window.MacedoniaAuth){clearInterval(t);cb();}},50);}function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(ch){return({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[ch];});}function setCount(n){document.getElementById("recordCount").textContent=n+" "+(n===1?"RECORD":"RECORDS");}function bankMark(){return '<span class="bank-mark"><svg viewBox="0 0 24 24"><path d="M3 10h18M5 10l2-5h10l2 5M5 10v9h14v-9M9 14h6"/></svg></span>';}waitSb(async function(){var s=await window.MacedoniaAuth.requireAuth();if(!s)return;var r=await fetch("/api/withdraw?user_id="+s.user.id),d=await r.json(),ws=d.withdrawals||[],el=document.getElementById("histList");setCount(ws.length);if(!ws.length){el.innerHTML='<div class="ledger-empty"><div class="empty-mark"><svg viewBox="0 0 24 24"><path d="M4 8h16M12 4v16M8 16l4 4 4-4"/></svg></div><strong>No payout requests</strong><span>Your withdrawal activity will appear here after you submit a payout request.</span></div>';return;}el.innerHTML=ws.map(function(w){var status=w.status||"pending",p=String(w.provider_status||"").toLowerCase(),providerPending=status==="approved"&&p&&!["completed","success","successful","paid","settled"].includes(p),label=providerPending?"provider pending":(status==="completed"?"completed":status),sc="s-"+(status==="completed"?"completed":(providerPending?"pending":status)),provider=w.provider?("PROVIDER: "+String(w.provider).toUpperCase()):"";return '<article class="payout-row"><div class="payout-main"><div class="payout-heading">'+bankMark()+esc(w.bank_name)+' <span class="status-tag '+sc+'">'+esc(label)+'</span></div><div class="payout-destination">'+esc(w.account_number)+' · '+esc(w.account_name)+'</div><div class="payout-date">'+esc(new Date(w.created_at).toLocaleString())+'</div>'+(provider?'<span class="payout-provider">'+esc(provider)+'</span>':'')+'</div><div class="payout-amount">'+window.MacedoniaAuth.money(w.amount)+'</div></article>';}).join("");});})();
</script></body></html>
